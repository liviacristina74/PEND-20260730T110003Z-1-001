<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>
<body>
    <h1 id="titulo">Cadastro de Produtos</h1>

    <!-- Campos de entrada para o usuário digitar -->
    <input id="nome" type="text" placeholder="Nome do Produto">
    <input id="preco" type="number" placeholder="Preço do Produto">     
    <input id="categoria" type="text" placeholder="Categoria do Produto">
    <input id="desconto" type="number" placeholder="Desconto do Produto (%)">

    <button id="botaoCadastrar">Cadastrar</button>
    <!-- REMOVA ESTA LINHA: <button id="botaoExcuir">Excuir</button> -->

    <!-- Onde a lista de produtos cadastrados vai aparecer -->
    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
