<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Web Storage</title>
</head>
<body>
    <h1>Web Storage</h1>

    <!-- 1. Mantido para a seção de Web Storage -->
    <input type="text" id="nome" placeholder="Digite seu nome">
    <button id="salvar">Salvar</button>
    <button id="recuperar">Recuperar</button>
    <button id="excluir">Excluir</button>

    <!-- id alterado para não conflitar com o cadastro -->
    <p id="resultado-storage"></p>

    <h1>Cadastro de Produtos</h1>

    <!-- 2. Alterado o ID para "nome-produto" -->
    <label>Nome:</label>
    <input type="text" id="nome-produto">

    <br><br>

    <label>Preço:</label>
    <input type="number" id="preco">

    <br><br>

    <label>Categoria:</label>
    <input type="text" id="categoria">

    <br><br>

    <label>Desconto:</label>
    <input type="number" id="desconto">

    <br><br>

    <!-- O evento onclick chama a função cadastrarProduto() -->
    <button onclick="cadastrarProduto()">Cadastrar</button>

    <h2>Produtos cadastrados:</h2>

    <!-- 3. Elemento exclusivo para renderizar a lista de produtos -->
    <div id="lista-produtos"></div>

    <script src="script.js"></script>
</body>
</html>
